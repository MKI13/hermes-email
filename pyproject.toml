[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-email"
version = "0.27.0"
description = "Safe Hermes email access with profile isolation and prompt-injection trust boundaries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "MKI13" }]
keywords = ["hermes-agent", "email", "plugin", "skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.urls]
Homepage = "https://github.com/MKI13/hermes-email"
Repository = "https://github.com/MKI13/hermes-email"
Issues = "https://github.com/MKI13/hermes-email/issues"

[tool.setuptools.packages.find]
include = ["hermes_email*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
